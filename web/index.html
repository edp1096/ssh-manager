<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SSH Manager</title>

    <meta name="google" content="notranslate">
    <meta name="microsoft" content="notranslate">

    <!-- source: https://www.svgrepo.com/svg/366485/terminal -->
    <link rel="icon" href="/icon/favicon.svg">
    <link rel="alternate icon" href="/icon/favicon.png">

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/material-icons.css">
    <link rel="stylesheet" href="/css/material-symbols-outlined.css">
    <link rel="stylesheet" href="/css/host-control.css">
    <link rel="stylesheet" href="/css/host-order.css">
    <link rel="stylesheet" href="/css/files.css">
    <link rel="stylesheet" href="/css/dialog.css">
    <link rel="stylesheet" href="/css/modals.css">
</head>

<body oncontextmenu="contextMenu(event); return false" onmousewheel="preventCtrlWheel(event)">
    <!-- list reordering -->
    <dialog id="order-container" aria-labelledby="order-title">
        <header class="order-header">
            <h2 id="order-title">Reorder host list</h2>
            <p>Drag groups to reorder them. Drag hosts within a group or into another group.</p>
        </header>
        <div id="order-lists" tabindex="-1" aria-label="Host order"></div>
        <footer id="order-buttons">
            <span id="order-status" role="status">Changes are applied only when you save.</span>
            <button onclick="closeReorderMode()" title="Cancel (Esc)">Cancel</button>
            <button onclick="saveReorderedList()" class="ok">Save changes</button>
        </footer>
    </dialog>

    <header class="workspace-header">
        <div id="workspace-tabs" role="tablist" aria-label="Workspace tabs">
            <div class="workspace-tab">
                <button id="tab-hosts" class="workspace-tab-button" role="tab" aria-selected="true" aria-controls="hosts-data-container" type="button">Hosts</button>
            </div>
        </div>
        <div class="workspace-tools" aria-label="Host tools">
            <button type="button" onclick="fileBrowser.quickConnect()" title="New FTP / FTPS connection" aria-label="New FTP / FTPS connection"><span class="material-symbols-outlined">add_link</span></button>
            <div class="button-group-left" data-host-tools>
                <button onclick="expandAllCategories()" title="Expand all">
                    <span class="material-symbols-outlined">expand_all</span>
                </button>
                <button onclick="collapseAllCategories()" title="Collapse all">
                    <span class="material-symbols-outlined">collapse_all</span>
                </button>
                <button onclick="getHosts()" title="Reload host list">
                    <span class="material-symbols-outlined">refresh</span>
                </button>
            </div>
            <div class="button-group-right">
                <button onclick="openCategoryEditDialog()" title="Add category" data-host-tool>
                    <span class="material-symbols-outlined">create_new_folder</span>
                </button>
                <button onclick="setReorderMode()" title="Reorder host list" data-host-tool>
                    <span class="material-symbols-outlined">swap_vert</span>
                </button>
                <button onclick="openChangePasswordDialog()" title="Change password of host file">
                    <span class="material-symbols-outlined">lock</span>
                </button>
                <button onclick="getApplicationVersion()" title="Info">
                    <span class="material-symbols-outlined">info</span>
                </button>
            </div>
        </div>
    </header>

    <main id="workspace-panels">
        <div id="hosts-data-container" role="tabpanel" aria-labelledby="tab-hosts">
            <ul class="categories"></ul>
        </div>
    </main>

    <dialog id="dialog-category-edit" aria-labelledby="category-edit-title" onclose="saveCategoryData(event)"></dialog>
    <dialog id="dialog-host-edit" aria-labelledby="host-edit-title" onclose="saveHostData(event)"></dialog>
    <dialog id="dialog-notice" aria-labelledby="notice-title"></dialog>
    <dialog id="dialog-confirm" aria-labelledby="confirm-title" onclose="doSpecificJob(event)"></dialog>

    <dialog id="dialog-enter-password" aria-labelledby="unlock-title" onclose="enterPassword()">
        <h2 id="unlock-title">Enter app password</h2>
        <form method="dialog">
            <p>
                <label for="enter-password-input">Password</label>
                <input type="password" id="enter-password-input" name="enter-password" required autocomplete="off" autofocus>
                <button type="button" class="password-toggle" data-password-toggle="enter-password-input" onclick="togglePasswordVisibility(this)" title="Show password" aria-label="Show password" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
            </p>

            <p>
                <button value="confirm" class="ok" title="Unlock (Enter in password field)">Unlock</button>
            </p>
        </form>
    </dialog>

    <dialog id="dialog-change-password" aria-labelledby="password-change-title" onclose="changeHostFilePassword(event)">
        <h2 id="password-change-title">Change host file password</h2>
        <form method="dialog">
            <p>
                <label for="change-password-old">Current password</label>
                <input type="password" id="change-password-old" name="password-old" required autocomplete="off">
                <button type="button" class="password-toggle" data-password-toggle="change-password-old" onclick="togglePasswordVisibility(this)" title="Show password" aria-label="Show password" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
            </p>
            <p>
                <label for="change-password-new">New password</label>
                <input type="password" id="change-password-new" name="password-new" required autocomplete="off">
                <button type="button" class="password-toggle" data-password-toggle="change-password-new" onclick="togglePasswordVisibility(this)" title="Show password" aria-label="Show password" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
            </p>

            <div>
                <button onclick="cancelChangePasswordDialog()" class="cancel" type="button" title="Cancel (Esc)">Cancel</button>
                <button value="confirm" class="ok" title="Change password (Enter in password field)">Change password</button>
            </div>
        </form>
    </dialog>

    <template id="dialog-category-edit-template">
        <h2 id="category-edit-title">@@_TITLE_@@</h2>
        <form method="dialog">
            <input type="hidden" id="category-idx" value="">
            <div>
                <label for="category-name">Group name</label>
                <input id="category-name" required>
            </div>

            <div>
                <button onclick="cancelCategoryEditDialog()" class="cancel" type="button" title="Cancel (Esc)">Cancel</button>
                <button value="confirm" class="ok" title="Save (Enter in text field)">Save</button>
            </div>
        </form>
    </template>

    <template id="category-buttons-template">
        <button onclick="openHostEditDialog(`@@_CATEGORY_IDX_@@`)" title="Add host">
            <span class="material-symbols-outlined">add</span>
        </button>
        <button onclick="openCategoryEditDialog(`@@_CATEGORY_IDX_@@`)" title="Rename category">
            <span class="material-symbols-outlined">edit</span>
        </button>
        <button onclick="openDeleteCategory('@@_CATEGORY_IDX_@@')" class="critical" title="Delete category">
            <span class="material-symbols-outlined">delete</span>
        </button>
    </template>

    <template id="category-data-template">
        <!-- <ul class="categories"> -->
        <li class="category">
            <span class="category-name" role="button" tabindex="-1" aria-expanded="false" data-category="@@_CATEGORY_IDX_@@">@@_CATEGORY_NAME_@@</span>
            <span class="buttons">@@_CATEGORY_BUTTONS_@@</span>
            @@_HOST_DATA_@@
        </li>
        <!-- </ul> -->
    </template>

    <template id="hosts-data-template">
        <ul class="host-part-info" tabindex="-1" data-category="@@_CATEGORY_IDX_@@" data-host="@@_HOST_IDX_@@" ondblclick="if (!event.target.closest('button')) connectSSH(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`, `new_window`)">
            <li class="part-name">
                <span class="label">Name:</span> <span>@@_NAME_@@</span>
            </li>
            <li class="part-address">
                <span class="label">Address:</span> <span>@@_ADDRESS_@@:@@_PORT_@@</span>
            </li>
            <li>
                <button onclick="openFileBrowser(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`)" title="Browse SFTP files (Ctrl+Enter)" aria-label="Browse SFTP files">
                    <span class="material-symbols-outlined">folder_open</span>
                </button>
                <button onclick="connectSSH(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`, `new_window`)" title="Open window (Enter)">
                    <span class="material-symbols-outlined">terminal</span>
                </button>
                <button onclick="connectSSH(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`)" title="Split terminal left / right (Shift+Enter)" aria-label="Split terminal left / right">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg>
                </button>
                <button onclick="connectSSH(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`, `split_vertical`)" title="Split terminal top / bottom" aria-label="Split terminal top / bottom">
                    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg>
                </button>
                <div class="button-section-divider"></div>
                <button onclick="openHostEditDialog(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`)" title="Edit host">
                    <span class="material-symbols-outlined">edit</span>
                </button>
                <button onclick="openDeleteHost(`@@_CATEGORY_IDX_@@`, `@@_HOST_IDX_@@`)" class="critical" title="Delete host">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </li>
        </ul>
    </template>

    <template id="dialog-host-edit-template">
        <h2 id="host-edit-title">@@_TITLE_@@</h2>
        <form method="dialog">
            <input type="hidden" id="category-idx" value="">
            <input type="hidden" id="idx" value="">
            <input type="hidden" id="auth-type-orig" value="">
            <h3 class="modal-section-title">Connection</h3>
            <div>
                <label for="host-edit-name">Name</label>
                <input type="text" id="host-edit-name" name="name" required autocomplete="off">
            </div>
            <div>
                <label for="host-edit-address">Address</label>
                <input id="host-edit-address" name="address" required autocomplete="off" placeholder="IP or domain">
            </div>
            <div>
                <label for="host-edit-port">Port</label>
                <input id="host-edit-port" type="number" name="port" autocomplete="off" placeholder="22">
            </div>
            <div>
                <label for="host-edit-username">Username</label>
                <input id="host-edit-username" name="username" required autocomplete="off">
            </div>

            <h3 class="modal-section-title">Authentication</h3>

            <div>
                <label for="use-password"><input onchange="setAuthType()" type="radio" id="use-password" name="auth-type" checked> Password</label>
                <label for="use-private-key-text"><input onchange="setAuthType()" type="radio" id="use-private-key-text" name="auth-type"> Private key</label>
            </div>
            <div>
                <label for="host-edit-password">Password</label>
                <input type="password" id="host-edit-password" name="password" required>
                <button type="button" class="password-toggle" data-password-toggle="host-edit-password" onclick="togglePasswordVisibility(this)" title="Show password" aria-label="Show password" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
            </div>

            <div>
                <label for="host-edit-private-key-text">Private key</label>
                <input type="file" id="host-edit-private-key-file" onchange="moveKeyFileToPrivateKeyText(event)">
                <textarea id="host-edit-private-key-text" name="private-key-text" required placeholder="Paste your private key here"></textarea>
                <button class="key-file-button" type="button" onclick="document.querySelector('#host-edit-private-key-file').click()">Choose key file…</button>
            </div>

            <div>
                <label for="host-edit-description">Description</label>
                <textarea id="host-edit-description" name="description"></textarea>
            </div>

            <div>
                <button onclick="cancelHostEditDialog()" class="cancel" type="button" title="Cancel (Esc)">Cancel</button>
                <button value="confirm" class="ok" title="Save (Enter in input field)">Save</button>
            </div>
        </form>
    </template>

    <template id="dialog-notice-template">
        <h2 id="notice-title">Notice</h2>
        <div>
            <p>@@_MESSAGE_@@</p>
            <div class="dialog-button-container">
                <button onclick="closeNotice(event)" class="ok" title="Close (Esc)">Close</button>
            </div>
        </div>
    </template>

    <template id="dialog-confirm-template">
        <h2 id="confirm-title">Confirm deletion</h2>
        <form method="dialog">
            <input type="hidden" name="job-type">
            <input type="hidden" name="datas">

            <p>@@_MESSAGE_@@</p>
            <div>
                <button onclick="cancelConfirmDialog()" class="cancel" type="button" title="Cancel (Esc)">Cancel</button>
                <button value="confirm" class="critical">Delete</button>
            </div>
        </form>
    </template>
</body>

<script>"use strict"</script>
<script src="/js/consts.js"></script>
<script src="/js/dialogs.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/ws.js"></script>
<script src="/js/input-events.js"></script>
<script src="/js/host-control.js"></script>
<script src="/js/host-order.js"></script>
<script src="/js/tabs.js"></script>
<script src="/js/files.js"></script>
<script src="/js/scripts.js"></script>

</html>
